[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "offset-sweep"
dynamic = ["version"]
description = "Measure how much a surface offset along the normal costs an ink-detection model"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14,<3.15"
dependencies = ["numpy>=2", "scipy>=1.13", "zarr>=3,<4", "tifffile>=2024.8", "pillow>=11", "matplotlib>=3.9"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
offset-sweep = "offset_sweep.cli:main"

[tool.setuptools.dynamic]
version = {attr = "offset_sweep.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
